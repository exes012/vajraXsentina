<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f2fe' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentinel Security — Cyber Command Telemetry & Data Visualization</title>
    
    <!-- Tailwind CSS CDN with forms & container queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              command: {
                950: '#040814',
                900: '#070f24',
                850: '#0a1532',
                800: '#0f1d42',
                700: '#16285a',
                glow: '#00e5ff',
                neonBlue: '#2563eb',
                brightBlue: '#38bdf8',
                crimson: '#f43f5e',
                emerald: '#10b981',
                amber: '#f59e0b',
                purple: '#8b5cf6'
              }
            },
            fontFamily: {
              mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
              sans: ['Inter', 'system-ui', 'sans-serif']
            }
          }
        }
      }
    </script>
    
    <!-- Google Fonts for High-Tech HUD Styling & Material Symbols -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <style data-purpose="custom-hud-styles">
      body {
        font-family: 'Inter', sans-serif;
        background-color: #030712;
        color: #cbd5e1;
        overflow-x: hidden;
      }

      .font-hud {
        font-family: 'Chakra Petch', sans-serif;
      }

      .tech-border-card {
        background: linear-gradient(180deg, rgba(15, 29, 66, 0.72) 0%, rgba(7, 15, 36, 0.88) 100%);
        border: 1px solid rgba(56, 189, 248, 0.16);
        box-shadow: 0 0 25px -5px rgba(2, 6, 23, 0.8), inset 0 0 15px 0 rgba(37, 99, 235, 0.05);
        position: relative;
      }

      .tech-header-badge {
        clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 100%, 0 100%);
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.45) 0%, rgba(14, 165, 233, 0.2) 100%);
        border-left: 3px solid #38bdf8;
      }

      .header-tab-bracket {
        clip-path: polygon(12px 0%, calc(100% - 12px) 0%, 100% 100%, 0% 100%);
      }

      .hud-slashes::after {
        content: "///";
        letter-spacing: 2px;
        color: rgba(56, 189, 248, 0.4);
        font-family: monospace;
        font-size: 11px;
        margin-left: 8px;
      }

      .glow-sphere-container {
        position: relative;
        filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.35));
      }

      /* Grid backdrop */
      .cyber-grid {
        background-size: 40px 40px;
        background-image: 
          linear-gradient(to right, rgba(56, 189, 248, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
      }

      /* Custom scrollbar for sidebar */
      .hud-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .hud-scrollbar::-webkit-scrollbar-track {
        background: rgba(7, 15, 36, 0.6);
      }
      .hud-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(56, 189, 248, 0.25);
        border-radius: 2px;
      }
      .hud-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(56, 189, 248, 0.5);
      }
    </style>
  </head>
  <body class="cyber-grid min-h-screen text-slate-200 antialiased selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
